<body class="bg-background text-on-background min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="h-16 px-gutter flex items-center max-w-container-max mx-auto w-full justify-between">
        <a href="index.html" class="flex items-center gap-sm">
            <img alt="CareerCompass AI Logo" class="h-8 w-8 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCgu2z4zPnaFbZ5qvbwCjKC7mLTGLeN6sElO0X9jVDwSnLMQQHvQ1rcG0fdyL6uI4v1u9ERE-xVSqK2HFaWuuKEiBZONZlLURuqE3ofpLVeo692fSAUmUz-qBwB5eEKq1iOdfw-iNh6ggYMSi8SwZiICmdvL_-xlCnIAaI8IYhHODipJiKPa954tcOr2X2AjibOM52GpW-7uHYXUbPTlcAzpV6cpNlgRGPl3DsC5e3TjN2Pmm3KFCx1"/>
            <span class="text-headline-sm font-headline-sm font-bold text-primary">CareerCompass AI</span>
        </a>
    </header>

    <!-- Main Form Container -->
    <main class="flex-1 flex items-center justify-center p-md">
        <div class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant p-8 rounded-xl shadow-lg">
            <div class="text-center mb-8">
                <h2 class="text-headline-md font-bold text-on-surface">Welcome Back</h2>
                <p class="text-body-sm text-on-surface-variant mt-1">Enter your details to access CareerCompass AI</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-md">
                <div>
                    <label for="email" class="block text-label-md font-medium text-on-surface-variant mb-2">Email Address</label>
                    <input type="email" id="email" required placeholder="name@domain.com" class="w-full px-4 py-3 rounded-xl border border-outline focus:ring-2 focus:ring-primary/20 focus:border-primary bg-transparent text-body-md text-on-surface"/>
                </div>
                
                <div>
                    <label for="password" class="block text-label-md font-medium text-on-surface-variant mb-2">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-outline focus:ring-2 focus:ring-primary/20 focus:border-primary bg-transparent text-body-md text-on-surface"/>
                </div>
                
                <div class="flex items-center justify-between mt-sm">
                    <label class="flex items-center text-body-sm text-on-surface-variant">
                        <input type="checkbox" class="rounded border-outline text-primary focus:ring-primary/20 mr-2"/>
                        Remember me
                    </label>
                    <a href="#" class="text-body-sm text-primary hover:underline">Forgot password?</a>
                </div>
                
                <button type="submit" class="w-full bg-primary text-on-primary py-3 rounded-xl font-label-md hover:brightness-95 active:scale-[0.98] transition-all mt-lg">
                    Sign In
                </button>
                
                <div class="flex items-center my-6">
                    <div class="flex-grow border-t border-outline-variant"></div>
                    <span class="px-4 text-label-sm text-on-surface-variant">or</span>
                    <div class="flex-grow border-t border-outline-variant"></div>
                </div>

                <button type="button" onclick="handleLogin(event)" class="w-full flex items-center justify-center gap-3 bg-surface text-on-surface border border-outline-variant py-3 rounded-xl font-label-md hover:bg-surface-container-low transition-all">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        <path fill="none" d="M1 1h22v22H1z" />

                    Sign in with Gmail

            </form>
            
            <p class="text-center text-body-sm text-on-surface-variant mt-8">
                Don't have an account? <a href="signup.html" class="text-primary font-medium hover:underline">Sign up</a>

    <!-- Footer -->

    </footer>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            // Just simulate redirecting to dashboard
            window.location.href = "chat.html";
        }
    </script>

<!-- Global Modal for Policies/Certs -->
<div id="global-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity">
  <div class="bg-surface border border-outline-variant p-xl rounded-2xl max-w-lg w-full shadow-2xl transform transition-transform scale-95 opacity-0" id="global-modal-content">
    <div class="flex justify-between items-start mb-md">
      <h3 class="text-headline-sm font-headline-sm text-on-surface" id="modal-title">Title</h3>
      <button onclick="closeModal()" class="text-on-surface-variant hover:text-error transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="text-body-md text-on-surface-variant space-y-sm" id="modal-body">
      Content
    </div>
    <div class="mt-lg flex justify-end">
      <button onclick="closeModal()" class="bg-primary text-on-primary px-lg py-2 rounded-xl font-label-md hover:brightness-95 transition-all">Close</button>
    </div>
  </div>
</div>
<script>
  function showModal(title, content) {
      const modal = document.getElementById('global-modal');
      const modalContent = document.getElementById('global-modal-content');
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = content;
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // small delay for transition
      setTimeout(() => {
          modalContent.classList.remove('scale-95', 'opacity-0');
          modalContent.classList.add('scale-100', 'opacity-100');
      }, 10);
  }
  function closeModal() {
      const modal = document.getElementById('global-modal');
      const modalContent = document.getElementById('global-modal-content');
      modalContent.classList.remove('scale-100', 'opacity-100');
      modalContent.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
      }, 200);
  }
</script>
